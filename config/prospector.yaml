# Project Prospector — configuration.
# Every value here is a DEFAULT (spec rev 3): change freely. Changes are detected by config hash
# and emit `config.changed` before any sensor runs (config honesty, CONTRACT).
# All times UTC.

store:
  root: ./store            # local store root; events/, snapshots/, ingest/, backtest/ live under it

universe:
  # Correlation grid: the 11 Select Sector SPDRs (55 pairs). Tickers here are seed/display only —
  # identity resolves to SEC series IDs before anything keys on them (HECO rule, CONTRACT).
  sectors: [XLK, XLC, XLY, XLP, XLE, XLF, XLV, XLI, XLB, XLRE, XLU]
  market: SPY              # market factor for the beta strip
  # Deliberate exclusion: the owner's holdings are NOT in the seed (novelty != interest; firewall).

windows:
  corr_days: 63            # rolling residual-correlation window
  baseline_days: 252       # baseline mean/std window (and rolling-beta window)
  stress_days: 21          # market-stress raw-correlation window

xcorr:
  z_in: 2.5                # Schmitt entry (calibrated by the milestone-3 backtest)
  z_out: 1.0               # Schmitt exit
  # Market-stress gate. RECALIBRATED 2026-07-02 (design thread, per spec §5), because the
  # milestone-3 β-strip diagnostic proved the strip is the primary market-factor defense (residual
  # mean corr -0.035 in the March-2020 crash). The gate is demoted to catching ACUTE crises only:
  # crash-onset β staleness + liquidity dislocations. The old absolute 0.65 was miscalibrated (it
  # gated 24.8% of days — sector ETFs sit at a calm baseline ~0.5-0.65). The level is LIFTED to 0.85.
  #
  # Form: ABSOLUTE level, not a baseline-relative departure. Market-wide mean pairwise correlation
  # is a fragility gauge with an INTRINSIC SCALE — 0.95 is a stressed market whether or not it was
  # 0.95 last month — so the level carries the meaning and normalizing it away destroys the signal.
  # (A baseline-relative departure was tested across level/baseline windows and rejected on evidence;
  # it is the right frame only for scale-free statistics like the pair residual correlation. This is
  # the absorption-ratio / correlation-concentration family — used as a level, never trailing-normed.)
  # See docs/decisions/2026-07-02-stress-gate-recalibration.md.
  #
  # 0.85 is FROZEN and PRINCIPLED (top ~2-3% of days; just above calm p95 ~0.81; onset latency ~5d,
  # the binding constraint for the β-staleness job), NOT fitted to any known case (the 2023 XLK×XLU
  # signal at level 0.667 is ungated at 0.80/0.85/0.90 alike). Changing it emits config.changed (loud).
  #
  # AGING WATCH-ITEM (17-yr horizon): absolute levels age. Headroom to calm p95 is only ~0.04. If
  # secular ETF-driven co-movement lifts the calm baseline toward 0.85, deliberately re-freeze
  # HIGHER. Fix aging by HUMAN recalibration only — NEVER a rolling percentile / self-updating
  # window (that is baseline-relative in disguise and reintroduces the rejected failure). The
  # backtest reports the calm-p95→gate margin each run so the drift is visible.
  # (Spec rev5 §13 names these keys stress_gate.window_days / stress_gate.absolute_level; the repo
  # keeps them under xcorr.stress as level_window / crisis_level — functionally identical, already
  # tested. Same values, same behavior.)
  stress:
    level_window: 21       # window for the market-wide correlation level (also the onset-lag lever)
    crisis_level: 0.85     # absolute correlation level that counts as an acute crisis — frozen

dispersion:
  z_in: 2.5
  z_out: 1.0
  weight_coverage: 0.90    # top holdings covering this fraction of basket weight (bounds the O(n^2) matrix)
  shadow_days: 90          # record-only burn-in (CONTRACT: ships shadow); advisory review horizon
  paging: false            # promotion to paging is a human config flip -> emits config.changed
  # Dispersion has its OWN correlation/baseline windows (spec §4b gives it 63/252), kept separate from
  # xcorr's `windows` block so the two sensors calibrate independently.
  window_days: 63          # constituent-correlation window (63d trailing returns per basket)
  baseline_days: 252       # Q baseline mean/std window (departure z reuses xcorr.departure_z on Q)
  min_constituents: 4      # below this many warmed names, no bipartition/Q (degenerate split)
  method: spectral         # spectral|hierarchical bipartition (DEFAULT spectral: small n, pure numpy)
  tick_cadence_days: 7     # weekly dispersion.tick while a lead is active
  # GENEROUS PAYLOAD (CONTRACT §4b, rev8): the dispersion.tick payload banks the substrate for the
  # deferred v2 proto-cluster layer (Appendix B) -- full membership + sub-cluster assignment +
  # correlation structure, NOT just scalar Q. You cannot backfill a payload you did not capture.
  # This knob controls how much correlation structure is persisted per tick:
  #   full    -> the whole pairwise matrix (DEFAULT during shadow burn-in: capture everything; weekly
  #              cadence x ~11 baskets x ~40 names is only kilobytes, and no-backfill dominates)
  #   topk    -> the correlation_top_k strongest within/cross pairs + within/between summaries
  #   summary -> within/between-cluster correlation means only
  correlation_detail: full
  correlation_top_k: 40    # pairs kept when correlation_detail == topk

rebalance:
  # Holdings-diff accretion (spec §4d). A watched fund's daily holdings are diffed vs the prior pull;
  # a MATERIAL change accretes a `rebalance` onto every live lead whose baskets include that fund
  # (forward-hash routing, CONTRACT §4d), else onto _system. Material = any add/drop of an IDENTIFIED
  # security (cash/derivative rows without a CUSIP are excluded — no spurious daily-cash firing), or a
  # weight delta at/above this threshold. Tune the threshold by hand if live tail-churn proves noisy;
  # never auto-tuned.
  weight_delta_threshold: 0.005   # 0.5% (DEFAULT, spec §4d)
  # The quarterly NPORT-P cross-check is a DEFERRED slice (parse_nport_holdings, §3b) — not wired here.

mandate:
  # Prospectus mandate-diff (spec §4d). A new prospectus filing on a watched fund -> extract its
  # principal-investment-strategy section, diff vs the prior filing, emit `mandate.changed` (a SILENT
  # corroboration the HUMAN adjudicates cosmetic-vs-substantive — never a pager). TARGETED section,
  # not a full-text diff: a whole-filing diff is a false-positive machine (fees/dates/boilerplate
  # churn — the diff-trap). Extraction is heading-bounded; when it is unreliable the sensor FLAGS a
  # fault for manual review rather than diffing the wrong thing. bs4 owns the HTML structure only.
  strategy_headings:        # the section that carries the thesis (case-insensitive, heading-line match)
    - principal investment strateg    # "Principal Investment Strategy/Strategies"
    - investment objective
  stop_headings:            # the strategy section ends at the next of these (the diff scope boundary)
    - principal risk
    - principal investment risk
    - performance
    - fees and expenses
    - portfolio management
    - purchase and sale
    - tax information
  min_section_chars: 80     # a shorter extraction is UNRELIABLE (flagged, never diffed)
  max_section_lines: 400    # no boundary within this many lines -> runaway -> UNRELIABLE

soi:
  # SOI-derived sector concentration (design docs/notes/2026-07-04-soi-derived-sector-concentration.md; the
  # §4c RESOLVER of `sectors_unresolved`). The daily xlsx leaves Sector "-" for an active fund, but the
  # fund's periodic EDGAR filing renders a GICS-INDUSTRY-grouped Schedule of Investments — each industry
  # header carries its % of net assets ("SOFTWARE — 38.7%", "ELECTRIC UTILITIES — 6.4%"). We isolate the
  # TARGET FUND's block (multi-fund NPORT-EX filings repeat the same industry headers per fund), parse the
  # "INDUSTRY — N.N%" headers, roll each to a GICS SECTOR via gics_industry_sector below, and RECONCILE
  # the summed weights to the fund's "COMMON STOCKS — N%" header. Extraction unreliable (fund block not
  # isolable, an industry name absent from the frozen table, or a reconcile miss) -> a `fault` for manual
  # review, NEVER a wrong sector set (the mandate-diff extraction-unreliable discipline, §4d). VERIFIED
  # against real TEKX NPORT-EX (2025-07-31 + 2026-01-31); the reconcile check already earned its keep by
  # catching a mixed-case "Specialized REITs" the first regex dropped.
  #
  # LIVE FETCH is WIRED in the M5 runner (`_run_soi_corroboration` resolves the accession/doc via
  # EdgarClient) — see the decision doc. These are the READER knobs.
  forms: [NPORT-EX, N-CSR, N-CSRS]      # forms that render the grouped SOI (the real TEKX docs are NPORT-EX)
  section_header: schedule of investments   # per-fund SOI title line (matches "CONSOLIDATED SCHEDULE ..." too)
  common_stocks_header: common stocks       # the equity-block start header ("COMMON STOCKS — N%")
  common_stocks_total: total common stocks  # the equity-block end boundary ("TOTAL COMMON STOCKS")
  # Summed industry weights must match the "COMMON STOCKS — N%" header within this tolerance (fraction of
  # net assets). Loose enough to absorb one-decimal rounding across ~16 industry lines, tight enough that
  # a genuinely dropped/misparsed industry (the REITs miss was 2.8pp) trips a fault. Both real fixtures
  # reconcile EXACTLY; this is headroom, not fitting. DEFAULT (tune if real filings prove noisy).
  reconcile_tolerance: 0.005            # 0.5pp

corroboration:
  # Launch corroboration hook (spec §4c, M4 capstone). A resolved launch's sectors are DERIVED from
  # its first holdings (ground truth, not prose); a direct sector-set overlap with a live lead's
  # baskets (BOTH sides of an xcorr pair, or the one dispersion basket) accretes the launch onto that
  # lead, making the cross-stream lag measurable there. No overlap / holdings-unavailable -> dormant
  # on _system (the honest coverage gap; the tool sees SPDR-format holdings only today). The backtest
  # keyword matcher + curated launch table stay in the backtest; the live path never uses them.
  sector_min_weight: 0.10   # a sector is "present" in a launch iff >= 10% of fund weight
  # §9d deferred-pass retry horizon: keep re-attempting a `sectors_unresolved` launch's SOI resolution
  # until its sectors land OR its detection ages past this many days, after which it stays
  # dormant-terminal and is surfaced for deliberate survey (never re-fetched forever). A SAFETY VALVE
  # against re-fetching ancient launches, deliberately GENEROUS: a fund's first sector-bearing NPORT-EX
  # is filed 60 days after a fiscal quarter-end, so a fund that lists just after one can wait the better
  # part of a year for its first — a year's headroom catches that reliably. DEFAULT (tune to real cadence).
  retry_horizon_days: 365

# SPDR ticker -> canonical GICS sector name (the launch's holdings carry these names; a lead's basket
# maps to one via this). Stable data — a fund's legal sector designation, never changes.
sector_map:
  XLK: Information Technology
  XLC: Communication Services
  XLY: Consumer Discretionary
  XLP: Consumer Staples
  XLE: Energy
  XLF: Financials
  XLV: Health Care
  XLI: Industrials
  XLB: Materials
  XLRE: Real Estate
  XLU: Utilities

# GICS INDUSTRY -> SECTOR rollup (CONTRACT frozen reference data — NOT a sensor knob). The SOI groups
# holdings by GICS INDUSTRY (74 of them); corroboration overlaps at the SECTOR level (11), so we roll
# industry -> sector here. Values are the EXACT 11 canonical sector names used in `sector_map` above
# (load-bearing: `overlaps` compares these strings to a lead's basket sectors — a name mismatch would
# silently never match). Keys are GICS industry names; the parser normalizes both sides (uppercase,
# "&"->"and", punctuation-insensitive) so filing renderings like "OIL, GAS & CONSUMABLE FUELS" and
# "SPECIALIZED REITs" match. FROZEN: re-freeze only on a GICS structure revision, with a config.changed
# fossil — never edited to rescue a threshold outcome. An industry absent here -> the SOI parser emits a
# `fault` (unknown industry), never a silent mis-roll.
#
# VERIFIED against PRIMARY-SOURCE GICS (2026-07-04): diffed row-by-row against MSCI's "GICS structure and
# definitions effective close of March 17, 2023" xlsx (sheet "GICS structure eff March 2023"), excluding
# the two discontinued industries (Internet & Direct Marketing Retail; Thrifts & Mortgage Finance).
# Result: 74/74 exact match, 0 mis-mapped sectors. The design-thread review flagged that the reconcile
# check guards parsing but not the rollup, so this table was checked against GICS itself, not recall (see
# docs/decisions/2026-07-04-soi-derived-sector-concentration.md). test_soi_config.py guards its shape.
gics_industry_sector:
  # Energy
  Energy Equipment & Services: Energy
  Oil, Gas & Consumable Fuels: Energy
  # Materials
  Chemicals: Materials
  Construction Materials: Materials
  Containers & Packaging: Materials
  Metals & Mining: Materials
  Paper & Forest Products: Materials
  # Industrials
  Aerospace & Defense: Industrials
  Building Products: Industrials
  Construction & Engineering: Industrials
  Electrical Equipment: Industrials
  Industrial Conglomerates: Industrials
  Machinery: Industrials
  Trading Companies & Distributors: Industrials
  Commercial Services & Supplies: Industrials
  Professional Services: Industrials
  Air Freight & Logistics: Industrials
  Passenger Airlines: Industrials
  Marine Transportation: Industrials
  Ground Transportation: Industrials
  Transportation Infrastructure: Industrials
  # Consumer Discretionary
  Automobile Components: Consumer Discretionary
  Automobiles: Consumer Discretionary
  Household Durables: Consumer Discretionary
  Leisure Products: Consumer Discretionary
  Textiles, Apparel & Luxury Goods: Consumer Discretionary
  Hotels, Restaurants & Leisure: Consumer Discretionary
  Diversified Consumer Services: Consumer Discretionary
  Distributors: Consumer Discretionary
  Broadline Retail: Consumer Discretionary
  Specialty Retail: Consumer Discretionary
  # Consumer Staples
  Consumer Staples Distribution & Retail: Consumer Staples
  Beverages: Consumer Staples
  Food Products: Consumer Staples
  Tobacco: Consumer Staples
  Household Products: Consumer Staples
  Personal Care Products: Consumer Staples
  # Health Care
  Health Care Equipment & Supplies: Health Care
  Health Care Providers & Services: Health Care
  Health Care Technology: Health Care
  Biotechnology: Health Care
  Pharmaceuticals: Health Care
  Life Sciences Tools & Services: Health Care
  # Financials
  Banks: Financials
  Financial Services: Financials
  Consumer Finance: Financials
  Capital Markets: Financials
  Mortgage Real Estate Investment Trusts (REITs): Financials
  Insurance: Financials
  # Information Technology
  IT Services: Information Technology
  Software: Information Technology
  Communications Equipment: Information Technology
  Technology Hardware, Storage & Peripherals: Information Technology
  Electronic Equipment, Instruments & Components: Information Technology
  Semiconductors & Semiconductor Equipment: Information Technology
  # Communication Services
  Diversified Telecommunication Services: Communication Services
  Wireless Telecommunication Services: Communication Services
  Media: Communication Services
  Entertainment: Communication Services
  Interactive Media & Services: Communication Services
  # Utilities  (all three roll to Utilities — TEKX's Jul-2025 10.7% only clears the floor TOGETHER)
  Electric Utilities: Utilities
  Gas Utilities: Utilities
  Multi-Utilities: Utilities
  Water Utilities: Utilities
  Independent Power and Renewable Electricity Producers: Utilities
  # Real Estate
  Diversified REITs: Real Estate
