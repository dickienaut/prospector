  Residential REITs: Real Estate
  Retail REITs: Real Estate
  Specialized REITs: Real Estate
  Real Estate Management & Development: Real Estate

# GICS-industry ALIASES: filing renderings that are NOT themselves GICS industries but unambiguously
# denote one. Kept SEPARATE from gics_industry_sector so that table stays EXACTLY the 74 canonical GICS
# industries (test_soi_config-guarded, CONTRACT-frozen); _build_table merges these on top, and an alias
# never clobbers a canonical key. Extend only for a proven filing-rendering variant, never to rescue a
# threshold outcome (same discipline as the frozen table); a change leaves a config.changed fossil.
#   - "Real Estate Investment Trusts" (H4): DFIN sometimes renders the equity-REIT industry GROUP as a
#     single collapsed header instead of the specific sub-industries (Diversified/Specialized/… REITs).
#     Mortgage REITs always carry the explicit "MORTGAGE" prefix (their own Financials row), so a plain,
#     unprefixed header is equity -> Real Estate. (Not observed in the two TEKX equity blocks — there the
#     plain header appears only under CORPORATE BONDS & NOTES, a bond-issuer class the COMMON STOCKS
#     bracket excludes — so this is a defensive alias proven synthetically; see the SOI-fetch decision doc.)
gics_industry_alias:
  Real Estate Investment Trusts: Real Estate

identity:
  retry_days: 10           # daily auto-retry window before the manual-resolution queue

oracle:
  active_lead_ceiling: 8   # counts active, non-shadow leads; tripwire banner, never auto-tune

snapshots:
  active: daily            # snapshot cadence while any lead is active
  quiet: weekly            # floor when the collection is quiet
  # plus an immediate snapshot on any state change (reactive tier)

capture:                   # milestone 6 — discourse capture (§6)
  k_queries: 5             # K deterministic templated queries per capture (no LLM authorship)
  top_n: 5                 # top-N constituent names fed into query construction
  m_fetch_urls: 2          # M result URLs fetched (extracted page text) per query
  max_searches_per_week: 60  # HARD cap (searches are exactly countable); breach pauses + faults
  unit_price_usd: 0.01     # web_search price per search ($10 / 1,000 searches) — VERIFY vs the live
                           # published price before arming; the USD estimate is count x this
  model: claude-haiku-4-5  # the search is a mechanical fetch-only call (prose discarded), so a cheap
                           # model is the cost-right default; paired with the basic web_search tool variant
  monthly_budget_usd: null # user sets before capture goes live; null = capture disabled. A DEFAULT
                           # (not CONTRACT) — raise it anytime by hand; each change fossils config.changed

backtest:
  corroboration_window_months: 24
  stress_window:           # March-2020 falsification window (test 5c)
    from: "2020-02-15"
    to: "2020-04-30"
  # Amended falsification (spec rev5 §10.5c-iii): a crash-window spawn is "free" only if it reverts
  # (Schmitt exit) within this bound — a spawn that persists is a durable lead, not a transient
  # crisis phenomenon, and is flagged for examination (real crisis-coincident shift vs stale-β).
  crash_revert_weeks: 8
  # Reviewed static data committed under tests/fixtures/backtest/ (identity seed + the
  # EDGAR-verified launch table). The backtest reads these, never live EDGAR (§10 test 5).
  series_ids_path: tests/fixtures/backtest/sector_series_ids.yaml
  launches_path: tests/fixtures/backtest/historical_launches.yaml
  # The frozen price pull the replay reads (pull-once-freeze, §3). Set by the ingest step.
  prices_source: yahoo
  prices_date: "2026-07-02"
  # (z_in, z_out) grid for --sweep; the report backs the chosen pair off from recall-optimal.
  sweep_grid:
    - [2.0, 1.0]
    - [2.5, 1.0]
    - [3.0, 1.0]
    - [3.5, 1.5]

# Sector -> keyword corroboration map (crude, deterministic, reviewable — spec test 5b).
# Used to auto-score backtest firings against launch/rebalance concentration industries.
sector_keywords:
  XLK: [technology, software, semiconductor, chip, "artificial intelligence", ai, cloud, computing, digital, cyber]
  XLC: [communication, media, telecom, internet, social, entertainment, streaming]
  XLY: [consumer discretionary, retail, e-commerce, travel, leisure, automotive, homebuild]
  XLP: [consumer staples, food, beverage, household, grocery]
  XLE: [energy, oil, gas, petroleum, drilling, refining, pipeline]
  XLF: [financial, bank, insurance, fintech, payments, capital markets]
  XLV: [health, healthcare, pharmaceutical, biotech, medical, life sciences]
  XLI: [industrial, manufacturing, aerospace, defense, machinery, transportation, infrastructure]
  XLB: [materials, chemical, mining, metals, steel, lithium]
  XLRE: [real estate, reit, property, "data center"]
  XLU: [utility, utilities, power, electric, electricity, grid, nuclear, "independent power"]

prices:
  primary: tiingo
  fallback: stooq
  # Tiingo made primary 2026-07-07: Yahoo's chart endpoint now sits behind a TLS-fingerprint bot
  # challenge (httpx/curl get an HTML "Too Many Requests"; a browser 200s; cookie+crumb does NOT
  # help), and Stooq's CSV endpoint sits behind a JavaScript proof-of-work gate. Tiingo EOD is a
  # clean JSON API we're authorized to call. Source is recorded per row (§3), so a future flip back
  # is data-honest; yahoo/stooq stay REGISTERED (no auto-fallback — the runner reads primary only).
  # See docs/decisions/2026-07-07-tiingo-price-source.md. TOKEN: env TIINGO_API_TOKEN (a git-ignored
  # .env), read at CLI startup, rides the Authorization HEADER — NEVER config, NEVER the URL (a URL
  # lands in the fossil record, so a query-string token would be an unfixable secret leak).
  stooq_suffix: ".us"
  # P1 GUARD (§3). A source's `close`-as-adjusted claim is fail-closed as LIVE (`guard_live_source`)
  # until a recorded-real split fixture proves it — an unadjusted close silently corrupts every
  # return across a split, the base of the whole sensor stack.
  # Stooq: `Close` only ASSUMED adjusted, never verified -> false (its endpoint is JS-gated anyway).
  stooq_adjusted_verified: false
  # Tiingo: reads `adjClose` (EOD Composite, genuinely adjusted). Verified true 2026-07-07 by
  # test_tiingo_adjclose_continuous_across_nvda_split (across the NVDA 2024-06-10 10:1 split, raw
  # `close` breaks ~10x, `adjClose` stays continuous, splitFactor≈10 on the ex-date). Flag moved by
  # PROOF, not convenience (P1 discipline).
  tiingo_adjusted_verified: true
  max_requests_per_sec: 2   # polite cap. Tiingo's binding limit is per-HOUR (50/hr on the free tier),
                            # not per-second — do NOT raise this: a lower per-second rate keeps
                            # accidental bursts (re-runs, retries) from stacking inside one hour and
                            # tripping the 50/hr cap. Throttle + 429/403 backoff mirror EdgarClient.

edgar:
  user_agent: "Prospector/1.0 (lyle@alphalabsengineering.com)"
  max_requests_per_sec: 8  # safety margin under SEC's 10/s

email:                     # §8a/§10 — the email sender (DEFAULT-class; transport = SMTP app-password,
                           # ratified over SES for portability — no AWS/domain step, works from the Mac mini).
  to: lyle@alphalabsengineering.com
  # from: defaults to `to` (single-mailbox self-send). Set only if sending from a different address.
  subject_prefix: "[PROS]"
  # SMTP transport. Leave smtp_host null/absent to run WITHOUT email (NullNotifier — records intent, sends
  # nothing); set it to enable sending. The app-password is a SECRET — it lives ONLY in the git-ignored
  # .env as PROSPECTOR_SMTP_PASSWORD (env, never here, never committed), exactly like TIINGO_API_TOKEN.
  # `pros run` fails fast if smtp_host is set but PROSPECTOR_SMTP_PASSWORD is unset.
  smtp_host: smtp.gmail.com          # e.g. smtp.gmail.com  (null -> email disabled)
  smtp_port: 587           # 587 STARTTLS (default) | 465 SSL
  smtp_security: starttls  # "starttls" | "ssl"

schedule:                  # milestone 7 — the runner owns the heartbeat cadence (M7-01/M7-05)
  daily_utc: "22:30"       # after US close + EOD data settle
  heartbeat_cadence_days: 7  # the §10 dead-man cadence: the runner sends the weekly heartbeat when the
                             # last `heartbeat.sent` is >= this many days old — a UTC gap-check that
                             # catches up a cycle the Mac slept through (the old run.sh local-weekday
                             # gate silently dropped a sleep-across-Sunday heartbeat, M7-01). Feeds both
                             # the send cadence and the §8a silence floor (one clock, one source).

s3:                        # milestone 7 — keys reserved now; sync is disabled when bucket is null
  bucket: null

backup:
  # Fossil-store durability (spec §7; build note docs/notes/2026-07-11-store-durability-backup.md).
  # `pros backup` mirrors the append-only trees (events/ snapshots/ ingest/ baselines/ runs/ registry/)
  # + a WAL-safe registry .backup snapshot to EACH target, incrementally (append-only -> only new/changed
  # files copy). A target that is not mounted-and-blessed FAULTS (fail-loud — a silent skip of a missing
  # drive is a backup that isn't happening); the healthy drive still gets the data. Bless each drive ONCE:
  #   touch <target>/.prospector-backup-target
  # Dual-local HDDs cover disk-death; offsite (S3/Backblaze) is deferred M7-hardening. Empty by default,
  # so `pros backup` faults loudly until the Mini's drive paths are configured here.
  targets: []                        # e.g. [/Volumes/ProspectorBackup1/prospector, /Volumes/ProspectorBackup2/prospector]
  marker: .prospector-backup-target  # the blessing sentinel each target drive must carry (DEFAULT)
