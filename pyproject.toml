[project]
name = "prospector"
version = "0.1.0"
description = "Project Prospector — watches the ETF universe for structural novelty and proposes reading, never orders."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "click>=8.1",
    # PINNED (not >=, unlike the rest): the ONLY dependency that parses external, occasionally-
    # malformed input (SEC prospectus HTML for the mandate-diff, §4d). A silent upstream parsing-
    # behavior change would perturb the extracted mandate section and thus the fossil record, so the
    # version is frozen for reproducibility; bump it deliberately. Infrastructure, not intelligence —
    # bs4 owns HTML STRUCTURE only; the mandate meaning/significance judgment stays in our code + the
    # human verdict. See docs/decisions/2026-07-03-mandate-diff-targeted-section.md.
    "beautifulsoup4==4.15.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
pros = "prospector.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prospector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
